name: build-pt
on:
  push:
    paths:
      - '.github/workflows/build-pt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 lxml
      - run: python3 tools/pt/build_pt.py . tools/pt
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Añadir idioma portugués (/pt/)" && git push)
