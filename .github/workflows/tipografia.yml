name: tipografia
on:
  push:
    paths:
      - '.github/workflows/tipografia.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar tipografia
        run: |
          python3 - <<'PY'
          import re, glob
          NEW = '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">'
          STYLE = '<style id="typo">h1,h2,h3{font-weight:700 !important;letter-spacing:-.02em !important}.brand b{font-weight:700 !important}</style>'
          n = 0
          for f in glob.glob('**/*.html', recursive=True):
              t = open(f, encoding='utf-8').read()
              o = t
              if 'fonts.googleapis.com' not in t:
                  continue
              t = re.sub(r'<link[^>]*fonts\.googleapis\.com/css2[^>]*>', NEW, t)
              t = re.sub(r'--f-display\s*:[^;}]*', '--f-display:"Plus Jakarta Sans","Inter",system-ui,sans-serif', t)
              t = re.sub(r'--f-body\s*:[^;}]*', '--f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif', t)
              t = re.sub(r'--f-mono\s*:[^;}]*', '--f-mono:"Inter",system-ui,sans-serif', t)
              if 'id="typo"' not in t:
                  t = t.replace('</head>', STYLE + '</head>', 1)
              if t != o:
                  open(f, 'w', encoding='utf-8').write(t)
                  n += 1
          print('archivos modificados:', n)
          PY
      - name: Commit
        run: |
          git config user.name "mesh-bot"
          git config user.email "mesh-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Nueva tipografia: Plus Jakarta Sans + Inter" && git push)
