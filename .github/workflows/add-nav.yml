name: add-nav
on:
  push:
    paths:
      - '.github/workflows/add-nav.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cat > /tmp/addnav.py <<'PYEOF'
          import re, glob, sys, os
          ROOT = sys.argv[1]
          os.chdir(ROOT)
          L = {
           'es': ['Inicio','Misión y visión','Nosotros','Ofertas laborales','Empresas (B2B)','Blog','Contacto','/es/nosotros/','/es/empresas/','/es/blog/'],
           'en': ['Home','Mission &amp; vision','About us','Job offers','Business (B2B)','Blog','Contact','/en/about/','/en/business/','/en/blog/'],
           'pl': ['Strona główna','Misja i wizja','O nas','Oferty pracy','Dla firm (B2B)','Blog','Kontakt','/pl/o-nas/','/pl/firmy/','/pl/blog/'],
           'pt': ['Início','Missão e visão','Sobre nós','Vagas de trabalho','Empresas (B2B)','Blog','Contato','/pt/sobre-nos/','/pt/empresas/','/pt/blog/'],
          }
          def nav_items(lg, on):
              t = L[lg]
              items = [('/%s/#inicio' % lg, t[0], 'home'), ('/%s/#mision' % lg, t[1], ''), (t[7], t[2], 'about'),
                       ('/%s/#ofertas' % lg, t[3], 'jobs'), (t[8], t[4], 'biz'), (t[9], t[5], 'blog'), ('/%s/#contacto' % lg, t[6], '')]
              return ''.join('<a href="%s"%s>%s</a>' % (h, ' class="on"' if k and k == on else '', x) for h, x, k in items)
          def section(path):
              p = path.split('/')
              k = p[1] if len(p) > 1 else ''
              if k in ('nosotros','about','o-nas','sobre-nos'): return 'about'
              if k in ('blog',): return 'blog'
              if k in ('ofertas','jobs','oferty'): return 'jobs'
              if k in ('empresas','business','firmy'): return 'biz'
              return ''
          CSS = '<style id="mnav">header .wrap.bar{max-width:1200px}.mnav{display:flex;gap:4px}.mnav a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:500;padding:8px 12px;border-radius:999px;transition:color .2s,background .2s}.mnav a:hover,.mnav a.on{color:var(--text);background:#ffffff0d}.tools{display:flex;align-items:center;gap:10px}.burger{display:none;width:40px;height:40px;border:1px solid var(--line-2);border-radius:999px;background:transparent;color:var(--text);cursor:pointer;place-items:center;padding:0}.burger svg{width:20px;height:20px}@media(max-width:900px){.mnav{position:absolute;left:0;right:0;top:100%;flex-direction:column;background:rgba(2,6,23,.97);padding:12px clamp(16px,4vw,40px) 24px;border-bottom:1px solid var(--line);opacity:0;transform:translateY(-8px);pointer-events:none;transition:all .25s}.mnav.open{opacity:1;transform:none;pointer-events:auto}.mnav a{padding:14px 12px;font-size:16px}.burger{display:grid}}</style>'
          JS = '<script>(function(){var b=document.getElementById("burger"),n=document.getElementById("nav");if(b&&n){b.addEventListener("click",function(){var o=n.classList.toggle("open");b.setAttribute("aria-expanded",o)});n.addEventListener("click",function(e){if(e.target.closest("a")){n.classList.remove("open");b.setAttribute("aria-expanded","false")}})}})();</script>'
          BURG = '<button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>'
          n1 = n2 = 0
          for f in sorted(glob.glob('*/**/index.html', recursive=True)):
              lg = f.split('/')[0]
              if lg not in L: continue
              s = open(f, encoding='utf-8').read(); o = s
              on = section(f)
              if re.search(r'<header>\s*<div class="wrap bar">', s) and 'id="mnav"' not in s and 'class="mnav"' not in s:
                  m = re.search(r'<header>\s*<div class="wrap bar">\s*(<a class="brand".*?</a>)\s*(<div[^>]*class="lang".*?</div>)\s*</div>\s*</header>', s, re.S)
                  if not m: print('NOMATCH', f); continue
                  aria = 'Menu główne' if lg == 'pl' else 'Principal'
                  hdr = '<header><div class="wrap bar">%s<nav class="mnav" id="nav" aria-label="%s">%s</nav><div class="tools">%s%s</div></div></header>' % (m.group(1), aria, nav_items(lg, on), m.group(2), BURG)
                  s = s[:m.start()] + hdr + s[m.end():]
                  s = s.replace('</head>', CSS + '</head>', 1)
                  s = s.replace('</body>', JS + '</body>', 1)
                  n1 += 1
              elif f.count('/') > 1 or f.split('/')[1] in ('firmy','empresas','business'):
                  m = re.search(r'(<nav [^>]*id="nav"[^>]*>).*?(</nav>)', s, re.S)
                  if m:
                      s = s[:m.start()] + m.group(1) + nav_items(lg, on) + m.group(2) + s[m.end():]
                      n2 += 1
              if s != o: open(f, 'w', encoding='utf-8').write(s)
          print('paginas simples:', n1, 'ofertas:', n2)

          PYEOF
          python3 /tmp/addnav.py .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Menu principal visible en todas las paginas" && git push)
